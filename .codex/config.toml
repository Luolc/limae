# The Rust binary is the product (ADR-0015 stage E); `cargo build` puts it
# here. The `test -x` guard is what makes a checkout that has never been
# built fail open — no polish block, original reply untouched. Setup and the
# knobs: docs/knowledge/polish-hook-self-trial.md.
[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'limae="$(git rev-parse --show-toplevel)/target/debug/limae"; if test -x "$limae"; then LIMAE_HOOK_AB_RATE=0 "$limae" hook; fi'
timeout = 120
statusMessage = "Polishing the response"
