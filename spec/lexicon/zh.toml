# AI 中文词典 —— 唯一一份正文。渲染成站点、注入 prompt、转成词表都从这里读。
# 给人读的引子也在这里 (preface)，不另开一份散文稿：同一批内容只写一处。

preface = [
  "这部词典收机器写的中文里的怪词。这些词都读得懂，但说中文的人不会这么说：多数是从英文逐字译过来的；另一些是把两个熟词硬凑在一起。",
  "这类词不容易被发现，原因恰恰是读得懂。读者看到「探针」能猜到是 probe，看到「正本」能猜到是 canonical，于是不会去报错，只会觉得读起来有点怪，然后接着往下读。一个看不懂的词很快就会被人改掉。读得懂的怪词没有这道关，可以在一个仓库里出现几十处，没有人动它。",
  "每个词条都写明这个词实际想说什么、中文里怎么说，再配几个带上下文的例子。词典可以喂给润色模型当判据，也可以转成词表交给 linter 直接报。",
]

standard = "看一个词该不该收，只问一句：说中文的人会不会这么说。不问读者看不看得懂：看得懂的怪词多得很，这部词典收的正是这一类。"
threshold = """
只是觉得别扭还不能收，要到真实的中文技术写作里找证据。找证据时问的是中文写到这个意思时怎么写，而不是有没有人这么写过：有人写过的怪词并不少。
先看这个意思在中文里本来有没有词。没有就收，比如中文里的「正本」指原件，从来不指「唯一权威的那份」。
如果本来就有，再问这个用法是不是离了某个英文词就不成立。如果它不依赖任何英文词，那就是中文自己的说法，再怪也不归这部词典管，到此为止。
如果它确实是跟着英文词来的，最后看中文写到这个意思时是不是都用它。如果都用它，它就已经是这个意思的中文名字，不收：「数据库」也是译来的，今天没人再想起 database。
要是中文写作还在按这一处到底指什么各自挑词，或者干脆把英文留着，那它只是那个英文词的一种中文写法，不是这个意思的中文说法。用它等于跳过了挑词这一步，这种要收。
「收下」「兜住整体成本」就属于中文本来就这么说、不依赖任何英文词的那一类，凭直觉收进来就是误伤。
两种错的代价不一样。误收一个好词，读者会按词典把一句正常的中文改掉，改掉之后很难有人再发现。漏收一个怪词，代价只是等下次遇到时再补进来。所以这部词典宁可少收。
"""

[[entry]]
term = "正本"
pinyin = ["zhèng", "běn"]
plain = "以哪一份为准"
gloss = "「正本」本意指与「副本」相对、有法律效力的原件，此处引申为「同一个事实唯一权威的那份」。"
fault = "中文里「正本」只用于法律文书，一份规范、一份记录并无正副之分，这样引申是把法律文书的词借到了工程里。要说以哪一份为准，直接说「以……为准」「写在这里，别处不重复」。"
examples = [
  { before = "规则语义的正本在 `spec/rules.md`，这里只记还没做的事。", after = "规则语义以 `spec/rules.md` 为准，这里只记还没做的事。" },
  { before = "backlog 的正本，由 orchestra 在合入后记账。", after = "backlog 写在这里，别处不重复，由 orchestra 在合入后记账。" },
  { before = "形制的正本是 ADR-0008 第 9 节。", after = "形制由 ADR-0008 第 9 节定。" },
  { before = "项目级 skill 正本在 `.agents/skills/`，不装到用户级目录。", after = "项目级 skill 只放在 `.agents/skills/`，不装到用户级目录。" },
]

[[entry]]
term = "测量装置"
pinyin = ["cè", "liàng", "zhuāng", "zhì"]
plain = "记录、台账"
gloss = "从 apparatus 一类的词译来，本意指做实验用的一套仪器，此处引申为一份持续记录数据的台账。"
fault = "中文里「装置」只指实物设备，不用来说一份数据记录，这样引申没有道理。要说记录，就说「记录」「台账」「现在能记录了」。"
examples = [
  { before = "今天到此为止，六个 PR 全部合入，两份新决定，测量装置在跑而且样本是干净的。", after = "今天到此为止，六个 PR 全部合入，两份新决定，记录在跑，样本也干净。" },
  { before = "PR 已合入，从现在起每一次润色都会留下三份文本。测量装置装好了。", after = "PR 已合入，从现在起每一次润色都会留下三份文本。现在能记录了。" },
  { before = "⑦ 是测量装置，⑧⑨ 的验收都要靠它。", after = "⑦ 是用来观察的那一层，⑧⑨ 的验收都要靠它。" },
]

[[entry]]
term = "按住不动"
pinyin = ["àn", "zhù", "bù", "dòng"]
plain = "先不动手、先停一下"
gloss = "「按住」本意指用手压住某物不放，此处引申为「暂缓推进」。"
fault = "中文没有这个引申，「按住」只表示物理上压住。要说暂缓，就说「先停一下」「先等一等」「先放着」。"
examples = [
  { before = "接下来我按住不动，等真实的单路记录攒够。", after = "接下来我先停一下，等真实的单路记录攒够。" },
  { before = "这条先按住不动，等额度恢复再说。", after = "这条先放着，等额度恢复再说。" },
]

[[entry]]
term = "扶正"
pinyin = ["fú", "zhèng"]
plain = "按你说的改、采纳"
gloss = "「扶正」本意指把歪的东西扶直，旧时也指把偏房立为正室，此处引申为「采纳对方的说法、按对方说的改」。"
fault = "中文里「扶正」只有上面两个意思，都与采纳一个说法无关，这样引申没有道理。要说采纳，就说「按你的来」「这个判断我改一下」。"
examples = [
  { before = "你补的那句旁证比你自己以为的更重要，我要把它扶正。", after = "你补的那句旁证比你自己以为的更重要，这话说得比我准，按你的来。" },
  { before = "这个判断我扶正一下：不是模型违规，是规则不存在。", after = "这个判断我改一下：不是模型违规，是规则不存在。" },
]

[[entry]]
term = "探针预注册"
pinyin = ["tàn", "zhēn", "yù", "zhù", "cè"]
plain = "开跑前把摸底试跑的判读标准定死"
gloss = "probe 与 preregistration 逐字译来合成的词，此处指「开跑前把小规模试跑的判读标准定死」。"
fault = "中文里没有这个词，是生造的。「探针」只指物理的针或性能剖析插的探针，没有「试跑」这个义项，这样引申没有道理。这个意思中文本来就有说法：「摸底试跑」「先跑一小批」，标准要先定就说「先把判读标准定下来」。"
examples = [
  { before = "`#368` (探针预注册) 我让它从 2×1 改成 2×2。", after = "`#368` (摸底试跑的判读标准) 我让它从 2×1 改成 2×2。" },
  { before = "探针只是预注册，实验还没跑。", after = "摸底试跑的标准只是先冻结下来，实验还没跑。" },
]

[[entry]]
term = "质量门"
pinyin = ["zhì", "liàng", "mén"]
plain = "质量标准"
gloss = "quality gate、quality bar 这类工程说法里「必须清的关卡」这层意思，字面译为「门」，此处指合入前必须达到的要求。"
fault = "中文里原来没有「质量门」这个词，是逐字译出来的。中文说合入前必须达到的要求，用「标准」「门槛」，不会把这件事说成「过一道门」。直接说「质量标准」「还没达到标准」。"
examples = [
  { before = "## 质量门 (quality bar)", after = "## 质量标准 (quality bar)" },
  { before = "这条 PR 还没过质量门，先别合。", after = "这条 PR 还没达到质量标准，先别合。" },
]

[[entry]]
term = "夹具"
pinyin = ["jiā", "jù"]
plain = "测试要先备好的那份东西，具体是什么得看这句在说哪一个"
gloss = "fixture 的中文译法，英汉词典里的头一个义项，此处指测试预先备好的那份东西。"
fault = "「夹具」中文里确实有，指机床上卡住工件的卡具，与测试无关。它作为 fixture 的译法是早年技术社区一个生硬的翻译，一直没流行开。中文碰到 fixture 也没有定于一尊的译法：有人按这一处实际指的东西写，有人索性留着 fixture。选哪个由句子定，「夹具」是不看句子、直接拿词典头一行填上去的结果。"
examples = [
  { before = "LSP / Node / Python / Ruby / Java / Wasm 都包了同一份 `Ignorer`，但没有跨 SDK 共用的 ignore 测试夹具，各绑一层冒烟。", after = "LSP / Node / Python / Ruby / Java / Wasm 都包了同一份 `Ignorer`，但没有一套跨 SDK 共用的 ignore 测试用例，各绑一层冒烟。" },
]

[[entry]]
term = "撑着"
pinyin = ["chēng", "zhe"]
plain = "依赖什么、离了什么就不成立"
gloss = "「撑着」本意指人硬顶住不倒，「靠……活着」本意指人靠什么维持生命，此处引申为一个说法、一个用法、一条断言「依赖什么、离了什么就不成立」。"
fault = "中文里「撑着」「活着」只说人或活物，一个说法既不会撑、也不会活，这样引申没有道理。要说依赖，就直接说「依赖」「离了它就不成立」。"
examples = [
  { before = "这个用法是不是只靠某个英文词才活着，抽掉那个英文词它就不存在。", after = "这个用法是不是离了某个英文词就不成立。" },
  { before = "中文里本来就这么说，不靠任何英文词撑着。", after = "中文里本来就这么说，不依赖任何英文词。" },
]

[[entry]]
term = "长出来"
pinyin = ["zhǎng", "chū", "lái"]
plain = "一步步加上去的、从用法里总结出来的"
gloss = "「长」本意指植物、毛发这类活物自己生长，此处引申为一套命名、一条规则、一项需求「不是一次设计出来的，而是后来一件一件加上去的，或者从已有用法里总结出来的」。"
fault = "中文里「长」只说活物，一套命名、一条规则不会自己生长；写成生长，是把 grow out of 这个英文比喻直接搬了过来。中文说这件事用「加上去的」「攒出来的」「总结出来的」，具体挑哪个看句子。"
examples = [
  { before = "这套命名是一步步长出来的，不是设计出来的，今天有三个问题：", after = "这套命名是一步步加上去的，没有整体设计过，今天有三个问题：" },
  { before = "新规则的判定只要依赖词表、密度或句式模板 (即从语言习惯里长出来的)，一律先 experimental。", after = "新规则的判定只要依赖词表、密度或句式模板 (即从语言习惯里总结出来的)，一律先 experimental。" },
  { before = "需求从旧系统里长出来。", after = "需求来自旧系统里的实际用法。" },
]
