# AI 中文词典 —— 唯一一份正文。渲染成站点、注入 prompt、转成词表都从这里读。
# 给人读的引子也在这里 (preface)，不另开一份散文稿：同一批内容只写一处。

preface = [
  "一部给机器写的中文里的怪词典。收的不是错字，是读得懂却没人这么说的词 —— 从英文逐字译来的、把两个熟词硬凑的、为了显得干脆而压掉成分的。",
  "它们难被发现，正因为读得懂：读者能从「探针」反推回 probe、从「正本」反推回 canonical，于是确实读懂了，读懂了就不会报错，于是它以「读起来怪，但能懂，算了」的形式一路通过。看不懂的词活不过一天，读得懂的怪词能在一个仓库里铺开几十处。",
  "每个词条给三样：它实际想说什么、中文里怎么说、几个带上下文的例子。用法有二：喂给润色模型当判据，或者转成词表交给 linter 直接报。",
]

standard = "看一个词该不该收，只问一句：说中文的人会不会这么说。不问「读者看不看得懂」——看得懂的怪词多了去了，这部词典收的正是这一类。"
threshold = """
只觉得别扭还不能收。得先去真的中文技术文章里翻一翻，翻得到有人这么写，就不收。
冤枉一个好词，等于把一句正常的中文赶出去；漏掉一个怪词，不过是下次再收。所以宁可少收。
「兜住整体成本」「需求从旧系统里长出来」这类说法在真实文档里都存在，凭直觉收进来就是误伤。
"""

[[entry]]
term = "正本"
pinyin = ["zhèng", "běn"]
plain = "以哪一份为准"
gloss = "「正本」与「副本」相对，指有法律效力的原件。用它说「同一个事实唯一权威的那份」，是把法律文书的词借到了工程里。"
examples = [
  { before = "规则语义的正本在 `spec/rules.md`，这里只记还没做的事。", after = "规则语义以 `spec/rules.md` 为准，这里只记还没做的事。" },
  { before = "backlog 的正本，由 orchestra 在合入后记账。", after = "backlog 写在这里，别处不重复，由 orchestra 在合入后记账。" },
  { before = "形制的正本是 ADR-0008 第 9 节。", after = "形制由 ADR-0008 第 9 节定。" },
  { before = "项目级 skill 正本在 `.agents/skills/`，不装到用户级目录。", after = "项目级 skill 只放在 `.agents/skills/`，不装到用户级目录。" },
]

[[entry]]
term = "测量装置"
pinyin = ["cè", "liàng", "zhuāng", "zhì"]
plain = "记录、台账"
gloss = "从 apparatus 一类的词译来。中文里「装置」指实物设备，不用来说一份数据记录。"
examples = [
  { before = "今天到此为止，六个 PR 全部合入，两份新决定，测量装置在跑而且样本是干净的。", after = "今天到此为止，六个 PR 全部合入，两份新决定，记录在跑，样本也干净。" },
  { before = "PR 已合入，从现在起每一次润色都会留下三份文本。测量装置装好了。", after = "PR 已合入，从现在起每一次润色都会留下三份文本。现在能记录了。" },
  { before = "⑦ 是测量装置，⑧⑨ 的验收都要靠它。", after = "⑦ 是用来观察的那一层，⑧⑨ 的验收都要靠它。" },
]

[[entry]]
term = "按住不动"
pinyin = ["àn", "zhù", "bù", "dòng"]
plain = "先不动手、先停一下"
gloss = "「按住」是用手压住某物不放。用它说「暂缓推进」没有这个引申义。"
examples = [
  { before = "接下来我按住不动，等真实的单路记录攒够。", after = "接下来我先停一下，等真实的单路记录攒够。" },
  { before = "这条先按住不动，等额度恢复再说。", after = "这条先放着，等额度恢复再说。" },
]

[[entry]]
term = "扶正"
pinyin = ["fú", "zhèng"]
plain = "按你说的改、采纳"
gloss = "「扶正」是把歪的东西扶直，或旧时把偏房立为正室，都与「采纳一个说法」无关。"
examples = [
  { before = "你补的那句旁证比你自己以为的更重要，我要把它扶正。", after = "你补的那句旁证比你自己以为的更重要，这话说得比我准，按你的来。" },
  { before = "这个判断我扶正一下：不是模型违规，是规则不存在。", after = "这个判断我改一下：不是模型违规，是规则不存在。" },
]

[[entry]]
term = "探针预注册"
pinyin = ["tàn", "zhēn", "yù", "zhù", "cè"]
plain = "开跑前把摸底试跑的判读标准定死"
gloss = "probe 与 preregistration 逐字译来。中文里「探针」是物理的针或性能剖析插的探针，没有「小规模试跑」这个义项，而这个意思中文本来就有词。"
examples = [
  { before = "`#368` (探针预注册) 我让它从 2×1 改成 2×2。", after = "`#368` (摸底试跑的判读标准) 我让它从 2×1 改成 2×2。" },
  { before = "探针只是预注册，实验还没跑。", after = "摸底试跑的标准只是先冻结下来，实验还没跑。" },
]

[[entry]]
term = "电报体"
pinyin = ["diàn", "bào", "tǐ"]
kind = "句式"
plain = "把省掉的主语与连接词补回去"
gloss = "为了显得干脆而省掉主语、连接词或动词，把话压成判断句。省略之后意思仍然唯一，所以读得懂，但读者要自己把成分补回去。陈述状态、列条目、表格单元格里的短句本来就不带主语，那不算。"
examples = [
  { before = "规则就在那儿，模型没执行。", after = "规则已经写在那里了，模型没有执行它。" },
  { before = "关着的路排在活着的路后面。", after = "没人用的先放着，正在用的先修。" },
  { before = "检查跑了，但被检查的量不是你以为的那个量。", after = "检查确实跑了，但它检查的东西不是你以为的那个。" },
]

[[entry]]
term = "质量门"
pinyin = ["zhì", "liàng", "mén"]
plain = "质量标准"
gloss = "quality bar 这类工程说法里「必须清的关卡」这层意思，被字面译成了「门」。中文说「合入前必须达到的要求」，用的是「标准」「门槛」这类词，不会把这件事说成「过一道门」。"
examples = [
  { before = "## 质量门 (quality bar)", after = "## 质量标准 (quality bar)" },
  { before = "这条 PR 还没过质量门，先别合。", after = "这条 PR 还没达到质量标准，先别合。" },
]

[[entry]]
term = "格言式收尾"
pinyin = ["gé", "yán", "shì", "shōu", "wěi"]
kind = "句式"
plain = "把拔高的措辞摊平，留住结论"
gloss = "段落结尾拔高成一句可以印在墙上的话。它读起来像结论，实际往往只是把上一句换个说法再说一遍。要去掉的是拔高的措辞，不是结论本身 —— 那句话往往同时是本段唯一的论断。"
examples = [
  { before = "一个属性如果靠「没人去用那条路径」成立，它就不是属性，是约定。", after = "一个属性如果只靠「没人去用那条路径」成立，那它依赖的是各方的自觉，不是机制。" },
  { before = "换措辞不等于修好。软化只是让它更难被发现。", after = "一个声称撑不住是因为缺证据，把词换软不会补上证据。" },
]
