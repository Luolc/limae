# Two things live here. `check` is the quality bar that also runs locally
# (see AGENTS.md); it keeps main always-green and is the required check for
# branch protection. `build` and `deploy` publish the lexicon page and the
# installer to GitHub Pages, which is release, not a gate — `deploy` is deliberately outside
# `check`, so a failed publish never blocks a merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; newer pushes cancel older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The credential scan below reads the history, so the checkout
          # has to be the whole of it.
          fetch-depth: 0

      # The other half of the credential scan the commit hook runs. The
      # hook scans the staged content, which is the only place a secret
      # can still be stopped; CI has nothing staged, so it scans what has
      # actually landed instead — a commit that skipped the hook, or a
      # branch pushed from a clone where `pre-commit install` was never
      # run. `--redact` keeps a hit out of the public build log.
      #
      # Pinned to the same version as the `gitleaks` hook in
      # .pre-commit-config.yaml; the two move together, checksum included.
      - name: Credential scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

      # Not a Python asset: `uv` is the carrier for `uvx pre-commit@…` below,
      # which runs pre-commit without a project, a lockfile or a virtualenv
      # in this repository.
      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Rust toolchain
        run: rustup show

      - name: Rust format
        run: cargo fmt --check

      - name: Rust lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo test --locked

      - name: Rust docs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --locked

      # The generator behind the published page. `site/index.html` is not
      # committed, so this is not about the page being current; it is about
      # the generator still running and the page still following its source.
      # The `build` job below renders the page the site actually gets, and a
      # render that crashes fails there too — what it cannot notice is a
      # generator that renders a page while ignoring its input. Needs the
      # Rust toolchain. What the gate does and does not cover is written at
      # the top of the script.
      - name: Lexicon page renders from its source
        run: tools/check_lexicon_render.sh

      # The lexicon's own Chinese prose, checked with this repo's own rules.
      # Same blind spot as the page above: the `limae` hook selects `\.md$`,
      # so the hundred-odd fields of spec/lexicon/*.toml were read by nobody.
      # The `pre-commit run --all-files` gate runs this through the hook;
      # this step is the one that runs
      # on a branch where `pre-commit install` never happened.
      - name: Lexicon prose is clean
        run: cargo run --quiet --locked --example lint-lexicon -- spec/lexicon/zh.toml

      # The step above guards the lexicon's prose; this one guards the linter.
      # `spec/lexicon/zh.toml` is clean, so running the tool over it prints
      # `OK` whether the line mapping is right, wrong, or deleted. This drives
      # the tool over fixtures whose line numbers are fixed and asserts them.
      # It re-runs the committed lexicon as its own control arm, not as a
      # second content gate: every other arm asserts something is reported,
      # and a linter that reported everything would pass them all.
      - name: Lexicon linter reports real lines
        run: tools/check_lexicon_lint.sh

      # The promises this repository makes to its own maintainers, which no
      # crate test can carry: the Codex Stop hook, the handbook's kind
      # table, and the file patterns of the cargo-fmt and limae-lexicon
      # hooks. Needs the Rust toolchain.
      - name: Repository contracts
        run: tools/check_repo_contracts.sh

      # gitleaks + cargo-fmt + limae, this repository's own hooks over its
      # own files.
      - name: pre-commit hooks
        run: uvx pre-commit@4.2.0 run --all-files --show-diff-on-failure

      - name: pre-commit consumer install
        run: tools/check_precommit_consumer.sh

      - name: Install Rust distribution targets
        run: rustup target add x86_64-unknown-linux-musl

      - name: Cargo source package
        run: tools/check_rust_package.sh package

      - name: Linux GNU binary
        run: tools/check_rust_package.sh target x86_64-unknown-linux-gnu

      - name: Linux musl binary
        run: tools/check_rust_package.sh target x86_64-unknown-linux-musl

  # The page that GitHub Pages serves, rendered from spec/lexicon/zh.toml on
  # every run. Nothing in the repository carries the rendered page any more,
  # so this job is where "the lexicon does not render" becomes visible — on
  # the pull request, before it can reach main and break the site.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup show

      - name: Render the lexicon page
        run: cargo run --locked --example render-lexicon

      # The installer is served from the same Pages site, so that
      # https://limae.luolc.com/install.sh is this repository's install.sh by
      # construction rather than by a promise someone has to remember to keep.
      # deno publishes a SHA256SUM for its install.sh that covers the copy in
      # the repository and not the bytes deno.land actually serves, and the
      # two have since drifted apart; copying the file at publish time is how
      # that stops being possible.
      - name: Copy the installer into the site
        run: cp install.sh site/install.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Publishing, not a quality gate: `check` is the required check, and a
  # failed deploy must not block a merge. Only main publishes — a pull
  # request evaluates this `if` to false and the job is reported as skipped,
  # which is a different reading from a job that was never defined.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
