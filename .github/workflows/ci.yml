# Fast PR gate: format/lint/type-check + tests — the same quality bar that
# runs locally (see AGENTS.md). Keeps main always-green; `check` is the
# required check for branch protection.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; newer pushes cancel older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The credential scan below reads the history, so the checkout
          # has to be the whole of it.
          fetch-depth: 0

      # The other half of the credential scan the commit hook runs. The
      # hook scans the staged content, which is the only place a secret
      # can still be stopped; CI has nothing staged, so it scans what has
      # actually landed instead — a commit that skipped the hook, or a
      # branch pushed from a clone where `pre-commit install` was never
      # run. `--redact` keeps a hit out of the public build log.
      #
      # Pinned to the same version as the `gitleaks` hook in
      # .pre-commit-config.yaml; the two move together, checksum included.
      - name: Credential scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync deps (creates .venv, installs dev group)
        run: uv sync

      - name: Rust toolchain
        run: rustup show

      - name: Rust format
        run: cargo fmt --check

      - name: Rust lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo test --locked

      - name: Rust docs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --locked

      - name: Tests (Python reference)
        run: uv run pytest -q

      - name: Rust differential artifacts
        run: cargo build --locked --bin limae-rs --example diff-probe

      - name: Tests (Python / Rust parity)
        run: uv run pytest -q --rust-bin target/debug/limae-rs

      # ruff + pyink + isort + basedpyright + pydoclint + uv-lock + limae.
      # basedpyright type-checks against .venv, so this runs after `uv sync`.
      - name: Format / lint / type-check
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: pre-commit Rust and Python distribution
        run: tools/check_rust_precommit.sh

      - name: Install Rust distribution targets
        run: rustup target add x86_64-unknown-linux-musl

      - name: Cargo source package
        run: tools/check_rust_package.sh package

      - name: Linux GNU binary
        run: tools/check_rust_package.sh target x86_64-unknown-linux-gnu

      - name: Linux musl binary
        run: tools/check_rust_package.sh target x86_64-unknown-linux-musl
