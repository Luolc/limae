# Fast PR gate: format/lint/type-check + tests — the same quality bar that
# runs locally (see AGENTS.md). Keeps main always-green; `check` is the
# required check for branch protection.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; newer pushes cancel older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The credential scan below reads the history, so the checkout
          # has to be the whole of it.
          fetch-depth: 0

      # The other half of the credential scan the commit hook runs. The
      # hook scans the staged content, which is the only place a secret
      # can still be stopped; CI has nothing staged, so it scans what has
      # actually landed instead — a commit that skipped the hook, or a
      # branch pushed from a clone where `pre-commit install` was never
      # run. `--redact` keeps a hit out of the public build log.
      #
      # Pinned to the same version as the `gitleaks` hook in
      # .pre-commit-config.yaml; the two move together, checksum included.
      - name: Credential scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync deps (creates .venv, installs dev group)
        run: uv sync

      - name: Rust toolchain
        run: rustup show

      - name: Rust format
        run: cargo fmt --check

      - name: Rust lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo test --locked

      - name: Rust docs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --locked

      - name: Tests (Python reference)
        run: uv run pytest -q

      # `site/index.html` is a committed product of the render-lexicon Cargo
      # example. The same blind spot: no other gate reads the page, so editing
      # spec/lexicon/zh.toml without regenerating it leaves every other gate
      # green. Needs the Rust toolchain.
      - name: Lexicon page is current
        run: tools/check_lexicon_render.sh

      # The lexicon's own Chinese prose, checked with this repo's own rules.
      # Same blind spot as the page above: the `limae` hook selects `\.md$`,
      # so the hundred-odd fields of spec/lexicon/*.toml were read by nobody.
      # Gate 10 runs this through pre-commit; this step is the one that runs
      # on a branch where `pre-commit install` never happened.
      - name: Lexicon prose is clean
        run: cargo run --quiet --locked --example lint-lexicon -- spec/lexicon/zh.toml

      # The step above guards the lexicon's prose; this one guards the linter.
      # `spec/lexicon/zh.toml` is clean, so running the tool over it prints
      # `OK` whether the line mapping is right, wrong, or deleted. This drives
      # the tool over fixtures whose line numbers are fixed and asserts them.
      # It re-runs the committed lexicon as its own control arm, not as a
      # second content gate: every other arm asserts something is reported,
      # and a linter that reported everything would pass them all.
      - name: Lexicon linter reports real lines
        run: tools/check_lexicon_lint.sh

      - name: Rust differential artifacts
        run: cargo build --locked --bin limae --example diff-probe

      - name: Tests (Python / Rust parity)
        run: uv run pytest -q --rust-bin target/debug/limae

      # ruff + pyink + isort + basedpyright + pydoclint + uv-lock + limae.
      # basedpyright type-checks against .venv, so this runs after `uv sync`.
      - name: Format / lint / type-check
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: pre-commit consumer install (Rust and Python)
        run: tools/check_precommit_consumer.sh

      - name: Install Rust distribution targets
        run: rustup target add x86_64-unknown-linux-musl

      - name: Cargo source package
        run: tools/check_rust_package.sh package

      - name: Linux GNU binary
        run: tools/check_rust_package.sh target x86_64-unknown-linux-gnu

      - name: Linux musl binary
        run: tools/check_rust_package.sh target x86_64-unknown-linux-musl
