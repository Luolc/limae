[project]
name = "lo-md-lint"
version = "0.4.0"
description = "Markdown linter, starting from Chinese technical-writing typography rules"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
lo-md-lint = "lo_md_lint.zh_format:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lo_md_lint"]

# Direct entry points only (AGENTS.md quality bar). ruff / pyink / isort /
# basedpyright run inside pre-commit's own environments; their versions are
# pinned once, in .pre-commit-config.yaml.
[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["**/__pycache__", "build"]
reportAny = false
reportExplicitAny = false
reportImplicitStringConcatenation = false
reportMissingTypeStubs = false
reportPrivateUsage = false
# Common in unit tests.
reportUninitializedInstanceVariable = false
# Many reports from built-in and third-party libraries
reportUnknownArgumentType = false
reportUnknownMemberType = false
# Too strict
reportUnknownVariableType = false
# False positives even with TYPE_CHECKING.
reportImportCycles = false

# Tests routinely call functions for their side effects or to assert on the
# exceptions they raise, so an unused return value is expected there.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportUnusedCallResult = false

[tool.pyink]
line-length = 80
pyink-indentation = 2
pyink-use-majority-quotes = true
target_version = ["py313"]

[tool.isort]
profile = "black"
line_length = 80
force_sort_within_sections = true
lexicographical = true
order_by_type = false
group_by_package = true
extra_standard_library = ["typing_extensions"]

[tool.ruff]
line-length = 80
indent-width = 2
target-version = "py313"

[tool.ruff.lint]
select = [
    "B",      # flake8-bugbear
    "C",      # flake8-comprehensions, mccabe (C90: max-complexity below)
    "D",      # pydocstyle — Google convention (see [tool.ruff.lint.pydocstyle])
    "D401",   # imperative mood: repo-wide choice; google convention would drop it
    "DTZ",    # flake8-datetimez: naive datetime / local-clock dates
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "G004",   # logging-f-string
    "ISC001", # single-line-implicit-string-concatenation
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "W505",   # doc-line-too-long (max-doc-length below)
    "RUF008", # mutable-dataclass-default
    "RUF012", # mutable-class-default
    "RUF013", # implicit-optional
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    # flake8-bandit, hand-picked (the full S group is too noisy).
    "S101",   # assert: stripped under -O, so never a runtime check (tests exempt)
    "S105",   # hardcoded-password-string
    "S106",   # hardcoded-password-func-arg
    "S107",   # hardcoded-password-default
    "S110",   # try-except-pass
    "S112",   # try-except-continue
    "S301",   # suspicious-pickle-usage
    "S602",   # subprocess-popen-with-shell-equals-true
    "S603",   # subprocess-without-shell-equals-true
    "S608",   # hardcoded-sql-expression
    "T201",   # print (CLI entry points exempt below)
]
ignore = [
    "E111", # indentation is not a multiple of 4
    "E114", # indentation is not a multiple of 4 (comment)
    "E117", # over-indented
    "W191", # indentation contains tabs
    # Trivial dunders are self-evident (Google guide §3.8.3 requires docstrings
    # only for public API / nontrivial / non-obvious functions).
    "D105",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.per-file-ignores]
# Google style §3.8.2.1: test modules need no docstrings (format rules apply);
# pytest asserts are the test mechanism, not runtime checks.
"tests/**" = ["D1", "S101"]
# CLI entry point: stdout is the user-facing output contract.
"src/lo_md_lint/zh_format.py" = ["T201"]

[tool.ruff.format]
# Disable ruff formatting. Use pyink in this project.
exclude = ["**/*.py", "**/*.pyi"]

[tool.pydoclint]
# Reconcile pydoclint with ruff's D107 (undocumented-public-init): D107
# requires an __init__ docstring, while pydoclint's default (DOC301) forbids
# one. Allow __init__ docstrings; pydoclint still checks their contents.
allow-init-docstring = true
