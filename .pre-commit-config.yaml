repos:
  # Credential scan, and the only hook here that guards a repository-wide
  # red line rather than a style: no credential may ever enter this public
  # repository's history (AGENTS.md 「隐私边界」). It scans the staged
  # content, not the history — history is what has already got away, and a
  # scan of it passes the token that is being committed right now.
  # `--redact` keeps a hit's own value out of the terminal and out of any
  # session log, which is the same rule the scan enforces. It is spelled
  # out in `args` even though this rev's own entry already carries it:
  # the flag is what keeps a credential out of the output, and a
  # non-negotiable property should be visible in this repository's own
  # configuration rather than inherited from whatever entry a given tag
  # happens to ship. (pre-commit appends `args` to the entry, so the
  # entry's own `--staged` still stands — see AGENTS.md on bumping the
  # rev.)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--redact", "--no-banner", "."]
  # Rust formatting, the one Rust check fast enough for a commit hook
  # (0.34s warm, against AGENTS.md's ≤5s budget). `cargo clippy` is
  # deliberately absent: it compiles every target and belongs to the
  # pre-push run and CI. The rule is "fast enough", not "Rust too".
  #
  # `pass_filenames: false` because this is the `cargo fmt --check` gate
  # verbatim — it resolves targets through `Cargo.toml` and so picks up the
  # package's edition. Handing rustfmt a bare file list instead would check
  # a different thing than the gate does. The cost is that any unformatted
  # Rust file blocks a commit that stages any other Rust file; that is the
  # same reach that gate has.
  #
  # `files` therefore has to list every file that can change what this
  # command prints, not just the ones it prints about. `Cargo.toml` fixes
  # the targets and the edition, a rustfmt.toml would carry the style
  # itself, and `rust-toolchain.toml` picks which rustfmt runs. A commit
  # touching only one of those reformats the tree without staging a single
  # `.rs`, and a hook keyed on `\.rs$` alone sleeps through it — the break
  # then surfaces at that gate in CI, which is exactly the trip this hook
  # exists to save. `tools/check_repo_contracts.sh` pins this pattern from
  # both sides — it has to wake for those files and stay out of
  # everything else — by asserting the expression the way pre-commit
  # applies it. The `pre-commit run --all-files` gate runs the hook itself.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: rust format (cargo fmt)
        language: system
        entry: cargo fmt --check
        files: (\.rs$|^Cargo\.toml$|^\.?rustfmt\.toml$|^rust-toolchain\.toml$)
        pass_filenames: false
  # Dogfooding: this repo's own Markdown is checked by this repo's linter —
  # the Rust one, which is now the product (ADR-0015 stage E).
  #
  # `cargo run` rather than `target/debug/limae` directly: a path to a
  # prebuilt binary passes just as green when that binary was built from a
  # commit weeks old, so the gate would be checking this repo's Markdown
  # against a ruleset that is not this repo's. `cargo run` cannot be stale.
  # Warm, `cargo run` is a cheap lookup; a commit that touched Rust sources
  # pays for the rebuild it already owed.
  #
  # `require_serial` because concurrent invocations would queue on Cargo's
  # build-directory lock instead of on the files.
  - repo: local
    hooks:
      - id: limae
        name: chinese markdown format (limae)
        language: system
        entry: cargo run --quiet --locked --bin limae --
        files: \.md$
        require_serial: true
  # The same linter over the lexicon's own Chinese prose. `spec/lexicon/*.toml`
  # carries the title, preface, standard, threshold and every entry's
  # explanation and examples — well over a hundred fields written to be read,
  # and none of them selected by the `\.md$` hook above. A lexicon about how
  # Chinese should be written had no gate on its own typography.
  #
  # `files` keys on the path, not on the extension. `.toml` in the hook above
  # would drag in `Cargo.toml`, `rust-toolchain.toml` and `askama.toml`, none
  # of which is prose; this expression takes the lexicon directory and nothing
  # else, so `en.toml` arrives without a configuration change.
  #
  # A separate Cargo example rather than a shell extractor: pulling strings
  # out of TOML with `sed` fails by not matching — a multi-line string or an
  # escape it mishandles is a field that is simply never checked, and the hook
  # stays green while doing nothing. `lint-lexicon` parses with the same crate
  # `render-lexicon` does and reports real TOML line numbers.
  - repo: local
    hooks:
      - id: limae-lexicon
        name: chinese lexicon format (limae)
        language: system
        entry: cargo run --quiet --locked --example lint-lexicon --
        files: ^spec/lexicon/.*\.toml$
        require_serial: true
