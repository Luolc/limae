# Release artifacts: on a version tag, build the `limae` binary — fully
# static musl for Linux, native for macOS — and attach it to a GitHub
# Release. Static musl linking works because the dependency tree is
# OpenSSL-free: limae does no networking at all (`Cargo.lock` has no
# openssl / openssl-sys entry).
#
# 0.13.0 was published to crates.io with an API token, because Trusted
# Publishing cannot be configured before the crate exists. Now that it
# does, `publish` below exchanges GitHub's OIDC identity for a short-lived
# registry token instead. See docs/knowledge/release.md.
#
# The same tag also publishes two thin launchers around those binaries: a
# wheel per target on PyPI and a `limae` package plus one `@limae/<platform>`
# package per target on npm (`launchers`, `publish-pypi`, `publish-npm`).
# Neither compiles anything; both repackage the Release tarballs, and
# tools/check_launchers.sh asserts that what went into every package is the
# Release binary, byte for byte.
#
# And it writes two repositories of its own: the pre-commit mirror,
# Luolc/limae-pre-commit (`mirror`), which lets pre-commit install that PyPI
# wheel instead of compiling limae; and the Homebrew tap, Luolc/homebrew-tap
# (`homebrew`), which carries a formula pointing back at these same Release
# tarballs.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Manual entry point; it never publishes. GitHub exposes this trigger on
  # the default branch, so the jobs it runs have to live in this file (see
  # the note on `auth-check`). One dispatch is the whole rehearsal:
  # `auth-check` and `npm-auth-check` verify credentials, `launchers`
  # repackages an existing Release as a dry run, and `homebrew` renders that
  # Release's formula and installs it.
  workflow_dispatch:
    inputs:
      tag:
        # No default: a default tag goes stale silently, and then "forgot to
        # fill it in" and "meant that one" look the same.
        description: "Existing Release tag (v<major>.<minor>.<patch>) the launcher and Homebrew dry runs work from"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # `on:` has exactly two triggers, so `github.event_name == 'push'` is the
  # tag push and nothing else. The four publishing jobs (`create-release`,
  # `publish`, `publish-pypi`, `publish-npm`) belong to it; `launchers`
  # runs on both; the two `*auth-check` jobs belong to the dispatch.
  # `upload-assets` needs this job and is skipped with it.
  #
  # `create-release` writes the body GitHub generates for itself: one line
  # per pull request merged since the previous Release, plus the compare
  # link. Squash merges make that list the changelog — every entry is a PR
  # title, and PR titles here are English commit subjects (AGENTS.md).
  # Nothing is written to the repository; there is no CHANGELOG.md to keep
  # in sync.
  #
  # `taiki-e/create-gh-release-action@v1` stood here before and has no
  # generate-notes switch: its only body source is `parse-changelog` over a
  # changelog file, and with no `changelog:` input it creates the Release
  # with an empty body (main.sh at v1, eba8ea9). That empty body is what
  # every Release so far holds: the API returns `body: null` for v0.13.0,
  # v0.13.1 and v0.13.2 alike (2026-09-12), and the commit message their
  # pages show is the web UI falling back to the tagged commit, not notes
  # anybody stored.
  #
  # What that action also did and this step does not: reject a malformed tag
  # (`on.push.tags` above is the stricter filter, and it is what decides
  # whether this job runs at all), flag a pre-release (that same filter
  # admits no pre-release tags), retry the create call, and delete an
  # existing Release before recreating it — so a whole-workflow re-run now
  # stops here instead of replacing the Release and its assets. Re-running
  # only the failed jobs (`gh run rerun --failed`, see the registry jobs
  # below) is unaffected. It never checked the tag against the manifest
  # version; that guard lives in `publish` and is untouched.
  #
  # No checkout: `gh` works from `GH_REPO`, and nothing here reads the
  # repository.
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # `--verify-tag` keeps this to the tag that triggered the run: without
      # it `gh` would create a missing tag on the default branch instead of
      # failing. `--title` pins the Release name to the tag, which is what
      # the previous action produced; `--generate-notes` would otherwise
      # name it too.
      - name: Create the Release with GitHub's generated notes
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Linux only: musl cross toolchain. The apple targets build natively
      # on the macOS runner (upload-rust-binary-action installs the target).
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: startsWith(matrix.os, 'ubuntu')
        with:
          target: ${{ matrix.target }}
      # Ships `limae-<target>.tar.gz` plus a sha256 sidecar. `bin:` is the
      # `[[bin]] name` in Cargo.toml; the examples are development-only and
      # are not released (AGENTS.md, directory conventions).
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: limae
          target: ${{ matrix.target }}
          tar: unix
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # The PyPI wheels and npm packages. On a tag push this runs once the
  # binaries are attached to the Release; on `workflow_dispatch` it takes the
  # assets of the tag given as input and is the dry run — build, check,
  # compare, stop. Nothing here publishes.
  #
  # `needs` alone would skip this job whenever `upload-assets` is skipped,
  # which is every dispatch. `!cancelled()` (rather than `always()`) keeps a
  # failed or cancelled build from being repackaged on a tag push while
  # letting the dispatch run proceed past the skipped dependency.
  launchers:
    needs: upload-assets
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.upload-assets.result == 'success') }}
    runs-on: ubuntu-latest
    # Read only: this job downloads public Release assets and uploads a
    # workflow artifact; the top-level `contents: write` is for
    # `create-release` and `upload-assets`. Nothing here talks to git after
    # the checkout, so the token is not kept in the checkout either.
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # `uv` carries `uvx wheel` and `uvx twine`; nothing Python is in the
      # repository (same arrangement as ci.yml).
      - uses: astral-sh/setup-uv@v9.0.0
      # tools/build_launchers.sh reads the package metadata with
      # `cargo metadata`; the binaries themselves are not built here.
      - name: Rust toolchain
        run: rustup show
      - name: Download the Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern 'limae-*' --dir assets
      - name: Build the wheels and npm packages from the Release tarballs
        run: tools/build_launchers.sh "$TAG" assets dist
      # The invariant, read off the finished packages: sha256 of the binary
      # inside each wheel and npm tarball against sha256 of the binary in the
      # Release tarball that passed its sidecar. Both values are in the log.
      - name: Assert every package carries the Release binary
        run: tools/check_launchers.sh "$TAG" assets dist
      - name: twine check
        run: uvx --from 'twine==6.1.0' twine check --strict dist/pypi/*.whl
      # The publish script itself, with `--dry-run` handed to `npm publish`.
      - name: npm publish --dry-run
        run: tools/npm_publish_set.sh dist/npm --dry-run
      # The runner is x86_64 Linux, so those two launchers can also be run.
      # The npm install names both tarballs and omits optional dependencies:
      # the platform package is not on the registry yet, and even after it
      # is, the one under test has to be this tarball and not that one.
      - name: Smoke-run the x86_64 Linux launchers
        run: |
          set -euo pipefail
          wheel=(dist/pypi/limae-*-manylinux*_x86_64*.whl)
          [ "${#wheel[@]}" -eq 1 ]
          uvx --from "${wheel[0]}" limae --help >/dev/null
          mkdir smoke && cd smoke && npm init -y >/dev/null
          npm install --omit=optional ../dist/npm/limae-linux-x64-*.tgz ../dist/npm/limae-cli-*.tgz
          npx limae --help >/dev/null
          echo "smoke: both launchers ran"
      - uses: actions/upload-artifact@v7
        with:
          name: launchers
          path: dist
          if-no-files-found: error

  # The three registries publish in the order of how little can be undone
  # afterwards, strictest guard first: crates.io (`publish`, which asserts
  # tag == manifest before it authenticates), then PyPI (a version can never
  # be reused), then npm (72 hours to unpublish). A failure stops the chain,
  # so a version that reaches any registry has passed the crates.io guard.
  #
  # Both registry jobs below can be re-run after a failure part-way through
  # an upload (`gh run rerun --failed`): each one first asks the registry
  # what it already holds for this version and compares it with the file
  # about to be uploaded — the same bytes is skipped, a missing file is
  # uploaded, different bytes under the same name stops the job. Neither
  # registry lets a name be uploaded twice, so a plain re-run would trip over
  # the files that did land, and a blanket "skip existing" would not tell
  # "already uploaded this" from "something else has that name".
  publish-pypi:
    if: github.event_name == 'push'
    needs: [launchers, publish]
    runs-on: ubuntu-latest
    # No `environment:`, like `publish`: the trusted publisher on PyPI is
    # configured with the environment left as "(Any)" (2026-09-10, from the
    # PyPI page), so naming one here would add a condition nobody asked for.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: launchers
          path: dist
      # The comparison with what PyPI already holds (see the note above the
      # job); the wheels left in dist/pypi afterwards are the ones to upload.
      - name: Drop the wheels PyPI already holds, byte for byte
        id: remaining
        run: |
          set -euo pipefail
          tools/pypi_upload_set.sh limae "${GITHUB_REF_NAME#v}" dist/pypi
          # nullglob: with every wheel dropped, the pattern must count 0,
          # not 1 for its own unexpanded self.
          shopt -s nullglob
          remaining=(dist/pypi/*.whl)
          echo "count=${#remaining[@]}" >>"$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.remaining.outputs.count != '0'
        with:
          packages-dir: dist/pypi

  # Trusted Publishing, like `publish` and `publish-pypi`: no long-lived
  # token in CI. npm's trusted publishers are per package and are entered by
  # hand on npmjs.com; all five were configured on 2026-09-11, which is what
  # unblocked this job losing `NPM_TOKEN`. npm needs no auth action here —
  # the CLI does the exchange itself inside `npm publish`, given
  # `id-token: write`. No `--provenance` either: with OIDC, a public
  # repository and public packages, npm turns it on by itself (see the npm
  # credentials section of docs/knowledge/release.md). The platform packages go first,
  # so the launcher's `optionalDependencies` resolve the moment it lands.
  # `@limae/<platform>` is scoped, and a scoped package publishes as
  # restricted unless told otherwise; `publishConfig.access` in each
  # package.json says public, so it holds however this command is written.
  publish-npm:
    if: github.event_name == 'push'
    needs: [launchers, publish-pypi]
    runs-on: ubuntu-latest
    # `id-token: write` is what npm exchanges for a short-lived registry
    # token; `contents: read` is for the checkout that brings tools/, not
    # something npm asks for.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: launchers
          path: dist
      # `registry-url` is kept, which is what npm's own Trusted Publishing
      # example does. It writes `_authToken=${NODE_AUTH_TOKEN}` into .npmrc
      # with nothing to fill it in, and that is fine on v7: the placeholder
      # token v6 exported (`XXXXX-XXXXX-XXXXX-XXXXX`) is gone — v7 exports
      # NODE_AUTH_TOKEN only when the caller provided one (actions/setup-node
      # PR #1558; two-arm reading, 2026-09-11: that string appears once in
      # v6's dist/setup/index.js and not at all in v7's). `npm publish`
      # attempts the exchange regardless of what is in .npmrc and overwrites
      # the entry on success, so the leftover line is inert; if the exchange
      # fails, the publish fails loudly rather than falling back to anything.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm's OIDC exchange needs npm >= 11.5.1 and Node >= 22.14.0 (npm's
      # Trusted Publishing documentation). `node-version: 24` settles the Node
      # half by construction, but the npm half rides on whatever the runner
      # image ships, so both are read and asserted rather than assumed — an
      # npm too old to exchange would otherwise fail further down as a plain
      # auth error. `sort -V` puts the lower version first, so "the required
      # version sorts first" is the assertion, and an empty reading fails it.
      - name: Assert the toolchain is new enough for OIDC
        run: |
          set -euo pipefail
          node_have="$(node --version)"
          npm_have="$(npm --version)"
          echo "node=$node_have npm=$npm_have (need node >= 22.14.0, npm >= 11.5.1)"
          [ "$(printf '%s\n%s\n' 22.14.0 "${node_have#v}" | sort -V | head -1)" = 22.14.0 ]
          [ "$(printf '%s\n%s\n' 11.5.1 "$npm_have" | sort -V | head -1)" = 11.5.1 ]
      # The script publishes the platform packages first and the launcher
      # last, and compares each tarball with what npm already holds before
      # publishing it (see the note above `publish-pypi`). `npm publish`
      # reads no credential from the environment now: it asks GitHub for an
      # OIDC token and the registry for a short-lived one in exchange.
      - name: Publish the platform packages, then the launcher
        run: tools/npm_publish_set.sh dist/npm

  # Trusted Publishing: no long-lived token in CI. The auth action swaps
  # the job's OIDC identity for a short-lived crates.io token and revokes
  # it in its post step. Shape taken from the crates.io docs; see
  # docs/knowledge/release.md, which records the source verbatim.
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Required for the OIDC token exchange — the only permission
      # crates.io asks for. `contents: read` is here because job-level
      # permissions zero out everything unlisted and actions/checkout
      # needs to read the repository; it is not a Trusted Publishing
      # requirement.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      # `cargo publish` uploads whatever `[package].version` says; the tag is
      # not an input to it. Pushing v0.13.1 at a commit whose manifest reads
      # 0.14.0 would publish 0.14.0 — a version crates.io cannot delete or
      # overwrite — while the GitHub Release still calls itself v0.13.1. So
      # assert equality first, in the positive form: the version has to be
      # read and has to equal the tag, and anything else stops the job before
      # it authenticates. This guard belongs to `publish` alone; `auth-check`
      # verifies OIDC and must stay free of the version policy.
      - name: Assert the tag matches the manifest version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked |
            jq -er '.packages[] | select(.name == "limae") | .version')"
          echo "tag=$GITHUB_REF_NAME manifest=v$version"
          [ "$GITHUB_REF_NAME" = "v$version" ]
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Verifies the Trusted Publishing configuration without spending a
  # version number: it authenticates and stops. Run it by hand from the
  # Actions tab.
  #
  # This job has to live in release.yml. The workflow filename is part of
  # the trusted publisher configuration, so the same job in, say,
  # tp-test.yml would fail even with a perfectly correct configuration —
  # a false negative.
  #
  # What a success or failure of this job actually proves: see
  # docs/knowledge/release.md.
  auth-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Status only. The token's value never reaches the log, an
      # artifact or the step summary — the check is existence, and
      # `echo`ing the variable itself would defeat the whole point.
      - name: Assert a token was issued
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "auth: token issued"
          else
            echo "auth: no token issued" >&2
            exit 1
          fi

  # The npm half of the credential rehearsal, and the counterpart of
  # `auth-check` above: it authenticates and stops, spending no version
  # number. Unlike crates.io, npm offers no action and no CLI command for
  # this — the exchange lives inside `npm publish` alone, and
  # `npm publish --dry-run` cannot stand in for it because npm's `oidc()` is
  # written never to throw, so a dry run exits 0 whether the exchange worked
  # or not. tools/npm_oidc_check.sh therefore makes the same two requests
  # the CLI makes, per package; what that does and does not prove is in its
  # header and in docs/knowledge/release.md.
  #
  # Like `auth-check`, this job has to live in release.yml: the workflow
  # filename is part of every trusted publisher configuration, so the same
  # job elsewhere would fail against a perfectly correct one.
  npm-auth-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # `id-token: write` for the exchange; `contents: read` for the checkout
    # that brings tools/ and the launcher manifest the package set is read
    # from.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No `registry-url`: nothing in this job talks to the registry through
      # npm, so there is no .npmrc to write. Node is here for the version
      # assertion, which is the other thing this rehearsal is for — catching
      # a runner image whose npm cannot do OIDC before a tag push does.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The same assertion `publish-npm` makes, made here a tag push earlier.
      # Nothing in this job needs npm — it is the publish job's environment
      # that is being rehearsed, and this and that job take their npm from
      # the same runner image.
      - name: Assert the toolchain is new enough for OIDC
        run: |
          set -euo pipefail
          node_have="$(node --version)"
          npm_have="$(npm --version)"
          echo "node=$node_have npm=$npm_have (need node >= 22.14.0, npm >= 11.5.1)"
          [ "$(printf '%s\n%s\n' 22.14.0 "${node_have#v}" | sort -V | head -1)" = 22.14.0 ]
          [ "$(printf '%s\n%s\n' 11.5.1 "$npm_have" | sort -V | head -1)" = 11.5.1 ]
      - name: Assert every package has a working trusted publisher
        run: tools/npm_oidc_check.sh launchers/npm/cli/package.json

  # The pre-commit mirror, Luolc/limae-pre-commit. It exists so that
  # `pre-commit` can install limae from a prebuilt PyPI wheel instead of
  # compiling it: pre-commit has no "download a binary" language, but
  # `language: python` needs a `pyproject.toml` at the hook repository root,
  # and this repository deliberately carries no Python project (ADR-0015).
  # That repository's own README and hook definition are hand-written; the
  # only thing written from here is the `limae==` pin and the matching tag.
  #
  # `needs: publish-pypi` is the whole ordering requirement: a tag there whose
  # pin names a version PyPI does not serve yet fails at `pip install` time,
  # in the consumer's repository rather than in this run.
  mirror:
    if: github.event_name == 'push'
    needs: publish-pypi
    runs-on: ubuntu-latest
    # Nothing here touches this repository; the mirror is written with
    # `PRECOMMIT_MIRROR_TOKEN`, and job-level permissions zero out the rest.
    permissions: {}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Luolc/limae-pre-commit
          token: ${{ secrets.PRECOMMIT_MIRROR_TOKEN }}
      - uses: astral-sh/setup-uv@v9.0.0
      # Positive assertion before anything is written: PyPI has to actually
      # serve this version, and the wheel it serves has to run. `needs` proves
      # the upload returned success, which is not the same as the index
      # answering for it — and the difference only shows up as a broken
      # `pip install` in someone else's repository.
      - name: Assert PyPI serves this version and the wheel runs
        run: uvx --from "limae==${TAG#v}" limae --help >/dev/null
      - name: Pin this version, commit and tag
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # sed exits 0 when its pattern matches nothing, so the grep below —
          # not the sed — is the check: after the edit, that exact line has to
          # be in the file.
          sed -i -E "s/^dependencies = \[\"limae==[^\"]*\"\]$/dependencies = [\"limae==$version\"]/" pyproject.toml
          grep -Fxq "dependencies = [\"limae==$version\"]" pyproject.toml
          echo "pin: $(grep -F 'limae==' pyproject.toml)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- pyproject.toml; then
            echo "pin: already at $version, nothing to commit"
          else
            git commit -q -m "Pin limae==$version" -- pyproject.toml
            git push origin HEAD:main
          fi

          # Re-runnable (`gh run rerun --failed`): a tag that already points at
          # the commit we would tag is this job having run before. A tag
          # pointing anywhere else is someone else's, and is not moved.
          #
          # The comparison has to be against the *commit*. An annotated tag's
          # own line carries the tag object's sha, not the commit's, and
          # `ls-remote <pattern>` filters the `^{}` line out — so a pattern
          # query would compare a tag object against a commit and fail a
          # re-run that should be green. This job pushes lightweight tags, but
          # a tag cut by hand or through the GitHub UI is annotated, and those
          # two have to be told apart rather than assumed away. So: list every
          # tag, and prefer the peeled line when there is one.
          head="$(git rev-parse HEAD)"
          refs="$(git ls-remote --tags origin)"
          peeled="$(printf '%s\n' "$refs" | awk -v t="refs/tags/$TAG^{}" '$2 == t { print $1 }')"
          direct="$(printf '%s\n' "$refs" | awk -v t="refs/tags/$TAG" '$2 == t { print $1 }')"
          existing="${peeled:-$direct}"
          if [ -n "$existing" ]; then
            echo "tag: $TAG already exists at commit $existing"
            [ "$existing" = "$head" ]
          else
            git tag "$TAG" "$head"
            git push origin "refs/tags/$TAG"
            echo "tag: pushed $TAG at $head"
          fi

  # The Homebrew tap, Luolc/homebrew-tap, so that `brew install
  # luolc/tap/limae` works. The formula is rendered here from the template in
  # tools/render_homebrew_formula.sh and points Homebrew at the Release
  # tarballs with their published digests; nothing is compiled, here or in the
  # tap, and the tap holds no bytes of its own.
  #
  # Like `launchers`, this job runs on both triggers and for the same reason,
  # except that here it matters more than anywhere else in this file: the
  # development machine is Linux with no Homebrew on it, so `brew audit`,
  # `brew install` and `brew test` cannot be run there at all. A
  # `workflow_dispatch` against an existing tag is where they run — every step
  # below except the last one, which is the only step gated on the tag push.
  #
  # macos-latest rather than ubuntu-latest: the macOS runner image ships
  # Homebrew, and macOS is what the tap is for. This run exercises one of the
  # four platforms in the formula; the other three are covered by their
  # digests, which came from the same Release assets `launchers` repackages.
  homebrew:
    needs: upload-assets
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.upload-assets.result == 'success') }}
    runs-on: macos-latest
    # The tap is written with HOMEBREW_TAP_TOKEN in the last step, which
    # brings its own checkout; nothing here needs write access to this
    # repository.
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Only the sidecars: the formula carries URLs and digests, so the
      # tarballs themselves are Homebrew's to fetch.
      - name: Download the Release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern 'limae-*.sha256' --dir assets
      - name: Render the formula
        run: tools/render_homebrew_formula.sh "$TAG" assets limae.rb
      # Through a local tap rather than as a bare file path: a formula handed
      # to brew as a path is a different code path from the one a user takes,
      # and taking the user's is the whole point of the steps after this.
      - name: Put the formula in a local tap
        run: |
          set -euo pipefail
          brew tap-new --no-git luolc/local
          cp limae.rb "$(brew --repository luolc/local)/Formula/limae.rb"
      # Before audit, because this is the claim audit does not make: a
      # formula that scanned the wrong version out of its URL passes
      # `brew audit --strict` just the same. The formula declares no
      # `version` of its own, so this step is the only thing standing
      # between a renamed tag or asset path and a silently wrong version.
      - name: Assert the formula's version is this tag
        run: tools/check_formula_version.sh "$TAG" luolc/local/limae
      - name: brew audit
        run: brew audit --strict luolc/local/limae
      # The arm that cannot be run anywhere else. `brew test` runs the
      # formula's own test block, which lints a clean file and a dirty one —
      # so a limae that starts but lints nothing fails here rather than
      # passing as "it installed".
      - name: brew install and brew test
        run: |
          set -euo pipefail
          brew install luolc/local/limae
          brew test luolc/local/limae
      # Only now, and only for a tag: a dispatch has proved everything above
      # and stops. The tap checkout keeps its credentials — it is the one that
      # pushes.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          repository: Luolc/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit the formula to the tap
        if: github.event_name == 'push'
        working-directory: tap
        run: |
          set -euo pipefail
          mkdir -p Formula
          cp ../limae.rb Formula/limae.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/limae.rb
          # Re-runnable (`gh run rerun --failed`): the formula this run would
          # write being the formula already there is this job having run
          # before, and there is nothing to commit.
          if git diff --cached --quiet; then
            echo "formula: already at $TAG, nothing to commit"
          else
            git commit -q -m "limae $TAG"
            git push origin HEAD:main
            echo "formula: pushed limae $TAG"
          fi
