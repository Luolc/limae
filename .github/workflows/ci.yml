# The quality bar, split into jobs that run in parallel, each only when
# `changes` says the paths it reads were touched; `check` sums them up and is
# the required check for branch protection. Nothing here publishes: the
# lexicon page and the installer go to GitHub Pages from pages.yml, so that
# a failed deployment cannot turn a main commit's run here red and keep it
# from being released.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Every main commit needs a result of its own: a release is cut only from
  # a commit whose push run here passed (tools/release_ci_green.sh). So each
  # one gets its own group, since in a shared group a newer run cancels a
  # pending one. On a PR branch, a newer push cancels the older run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Which path groups this change touches. A group is named after the job
  # that reads those paths; `docs` and `launchers` have no job here and
  # exist so that a change to them alone skips the rest (a path in no group
  # runs everything). The Rust sources embed spec/ at compile time
  # (`include_str!`), so every Rust job reads spec/ as well. Anything that
  # changes how every job runs, the toolchain and the lock file included,
  # runs them all.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # find the last green run of this workflow on main
    outputs:
      groups: ${{ steps.changes.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        uses: Luolc/ci-actions/changes@ad865a7a9c01b617b1becb685995ea590252d698 # main, 2026-10-10
        with:
          groups: |
            clippy:    rust/** spec/**
            test:      rust/** spec/** skills/**
            package:   rust/** spec/** README.md README.en.md LICENSE
            binaries:  rust/** spec/**
            consumer:  rust/** spec/**
            docs:      docs/** *.md .agents/** .claude/** .limae-ignore
            launchers: launchers/** install.sh
          run-all-on: >-
            .github/** tools/** .pre-commit-config.yaml .pre-commit-hooks.yaml
            Cargo.toml Cargo.lock rust-toolchain.toml askama.toml

  # The other half of the credential scan the commit hook runs. The hook
  # scans the staged content, which is the only place a secret can still be
  # stopped; CI has nothing staged, so it scans the commits of this pull
  # request or push instead — a commit that skipped the hook, or a branch
  # pushed from a clone where `pre-commit install` was never run. The whole
  # history is scanned weekly by gitleaks.yml.
  #
  # Pinned to the same version as the `gitleaks` hook in
  # .pre-commit-config.yaml; the two move together.
  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the commits of the PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          # Commenting on the PR would need pull-requests: write; the job
          # log and summary show the finding.
          GITLEAKS_ENABLE_COMMENTS: false

  # Runs on every change: the pre-commit hooks lint this repository's own
  # Markdown with limae itself, so even a docs-only change builds limae.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Not a Python asset: `uv` is the carrier for `uvx pre-commit@…` below,
      # which runs pre-commit without a project, a lockfile or a virtualenv
      # in this repository.
      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Rust toolchain
        run: rustup show

      - name: Rust format
        run: cargo fmt --check

      # The promises this repository makes to its own maintainers, which no
      # crate test can carry: the handbook's kind table, and the file
      # patterns of the cargo-fmt and limae-lexicon hooks. Needs the Rust
      # toolchain. It reads docs/ and .pre-commit-config.yaml, which is why
      # it sits in the job that runs on every change.
      - name: Repository contracts
        run: tools/check_repo_contracts.sh

      # gitleaks + cargo-fmt + limae, this repository's own hooks over its
      # own files.
      - name: pre-commit hooks
        run: uvx pre-commit@4.2.0 run --all-files --show-diff-on-failure

      # The guards release.yml runs before it publishes anything. The
      # waiting arms poll without a pause.
      - name: Release guards
        timeout-minutes: 5
        run: tools/check_release_guards.sh

  clippy:
    needs: changes
    if: fromJSON(needs.changes.outputs.groups).clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup show

      - name: Rust lint
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    needs: changes
    if: fromJSON(needs.changes.outputs.groups).test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup show

      - name: Rust tests
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo test --locked

      - name: Rust docs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --locked

      # The generator behind the published page. `site/index.html` is not
      # committed, so this is not about the page being current; it is about
      # the generator still running and the page still following its source.
      # The `build` job in pages.yml renders the page the site actually gets,
      # and a render that crashes fails there too — what it cannot notice is a
      # generator that renders a page while ignoring its input. Needs the
      # Rust toolchain. What the gate does and does not cover is written at
      # the top of the script.
      - name: Lexicon page renders from its source
        run: tools/check_lexicon_render.sh

      # The committed skill under skills/write-naturally/ is generated from
      # spec/skill/ and spec/lexicon/zh.toml and, unlike the page above, is
      # committed — it is used as files out of a clone. This is the gate
      # that notices a source edited without a re-render. Same family as
      # the step above (a generator over the lexicon, needs only the Rust
      # toolchain), so it sits next to it. The control arm is inside the
      # script.
      - name: Skill matches its sources
        run: tools/check_skill_render.sh

      # The lexicon's own Chinese prose, checked with this repo's own rules.
      # Same blind spot as the page above: the `limae` hook selects `\.md$`,
      # so the hundred-odd fields of spec/lexicon/*.toml were read by nobody.
      # The `pre-commit run --all-files` gate runs this through the hook;
      # this step is the one that runs
      # on a branch where `pre-commit install` never happened.
      - name: Lexicon prose is clean
        run: cargo run --quiet --locked --example lint-lexicon -- spec/lexicon/zh.toml

      # The step above guards the lexicon's prose; this one guards the linter.
      # `spec/lexicon/zh.toml` is clean, so running the tool over it prints
      # `OK` whether the line mapping is right, wrong, or deleted. This drives
      # the tool over fixtures whose line numbers are fixed and asserts them.
      # It re-runs the committed lexicon as its own control arm, not as a
      # second content gate: every other arm asserts something is reported,
      # and a linter that reported everything would pass them all.
      - name: Lexicon linter reports real lines
        run: tools/check_lexicon_lint.sh

  package:
    needs: changes
    if: fromJSON(needs.changes.outputs.groups).package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup show

      - name: Cargo source package
        run: tools/check_rust_package.sh package

  binaries:
    needs: changes
    if: fromJSON(needs.changes.outputs.groups).binaries
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup show

      - name: Install the Rust distribution target
        run: rustup target add ${{ matrix.target }}

      - name: Linux binary
        run: tools/check_rust_package.sh target ${{ matrix.target }}

  consumer:
    needs: changes
    if: fromJSON(needs.changes.outputs.groups).consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Rust toolchain
        run: rustup show

      - name: pre-commit consumer install
        run: tools/check_precommit_consumer.sh

  check:
    needs: [changes, gitleaks, lint, clippy, test, package, binaries, consumer]
    # Without always(), a failed job would skip this one, and a skipped
    # required check counts as passed.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: Luolc/ci-actions/all-green@ad865a7a9c01b617b1becb685995ea590252d698 # main, 2026-10-10
        with:
          needs: ${{ toJSON(needs) }}
