[package]
name = "limae"
version = "0.13.0"
edition = "2024"
publish = false
include = [
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "rust-toolchain.toml",
  "rust/**/*.rs",
  "spec/**",
]

[lib]
path = "rust/lib.rs"

[[bin]]
name = "limae-rs"
path = "rust/main.rs"

[[test]]
name = "integration"
path = "rust/tests/integration.rs"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
globset = "0.4"
ignore = "0.4"
regex = "1"
soft-canonicalize = { version = "0.5", default-features = false }
thiserror = "2"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["fs", "process"] }
