[package]
name = "limae"
version = "0.13.0"
edition = "2024"
license = "Apache-2.0"
description = "A Markdown linter that starts from Chinese technical-writing typography rules, with opt-in experimental rules for AI tells and terminology"
repository = "https://github.com/Luolc/limae"
readme = "README.md"
keywords = ["markdown", "linter", "typography", "chinese", "cjk"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE",
  "/README.md",
  "/rust-toolchain.toml",
  "/askama.toml",
  "/rust/**/*.rs",
  "/rust/templates/**",
  "/spec/README.md",
  "/spec/fixtures/**",
  "/spec/lexicon/zh.toml",
  "/spec/polish/**",
  "/spec/rules.md",
  "/spec/wordlists/**",
]

[lib]
path = "rust/lib.rs"

[[bin]]
name = "limae"
path = "rust/main.rs"

[[example]]
name = "hook-kinds"
path = "rust/tools/hook_kinds.rs"

[[example]]
name = "render-lexicon"
path = "rust/tools/render_lexicon.rs"

[[example]]
name = "lint-lexicon"
path = "rust/tools/lint_lexicon.rs"

[[test]]
name = "integration"
path = "rust/tests/integration.rs"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
getrandom = { version = "0.4", features = ["std"] }
globset = "0.4"
ignore = "0.4"
regex = "1"
serde_json = "1"
soft-canonicalize = { version = "0.5", default-features = false }
thiserror = "2"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
askama = { version = "0.16.1", default-features = false, features = ["config", "derive", "std"] }
serde = { version = "1", features = ["derive"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["fs", "process"] }
