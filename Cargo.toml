[package]
name = "limae"
version = "0.13.0"
edition = "2024"
publish = false
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/rust-toolchain.toml",
  "/rust/**/*.rs",
  "/spec/README.md",
  "/spec/fixtures/**",
  "/spec/polish/**",
  "/spec/rules.md",
  "/spec/wordlists/**",
]

[lib]
path = "rust/lib.rs"

[[bin]]
name = "limae-rs"
path = "rust/main.rs"

[[example]]
name = "diff-probe"
path = "rust/examples/diff_probe.rs"

[[test]]
name = "integration"
path = "rust/tests/integration.rs"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
getrandom = { version = "0.4", features = ["std"] }
globset = "0.4"
ignore = "0.4"
regex = "1"
serde_json = "1"
soft-canonicalize = { version = "0.5", default-features = false }
thiserror = "2"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["fs", "process"] }
